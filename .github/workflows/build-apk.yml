name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Generate Native Android Project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: https://mivo-server.onrender.com/api/v1
          EXPO_PUBLIC_WS_URL: https://mivo-server.onrender.com

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK (Debug / Installable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://mivo-server.onrender.com/api/v1
          EXPO_PUBLIC_WS_URL: https://mivo-server.onrender.com

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mivo-mobile-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
